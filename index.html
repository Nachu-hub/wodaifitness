<style>
:root{--deep:#08162E;--deep-2:#0E2244;--fg:#F2F5F9;--muted:#9DB0CA;--line:rgba(242,245,249,.14);--accent:#F5C518;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:linear-gradient(180deg,var(--deep),var(--deep-2));color:var(--fg);font-family:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:1.0625rem;line-height:1.6;-webkit-font-smoothing:antialiased}
main{min-height:100%;max-width:960px;margin-inline:auto;padding-inline:24px;padding-block:max(64px,env(safe-area-inset-top)) max(48px,env(safe-area-inset-bottom));display:flex;flex-direction:column;justify-content:center;gap:24px}
.label{font-size:.75rem;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0}
h1{margin:0;font-family:"Archivo","Arial Narrow",Arial,sans-serif;font-stretch:68%;font-variation-settings:"wdth" 68;font-weight:800;text-transform:uppercase;font-size:clamp(2.8rem,9vw,6rem);line-height:.88;overflow-wrap:break-word}
h1 i{font-style:normal;color:var(--accent)}
p{margin:0;max-width:30em;color:var(--fg);opacity:.86;font-size:1.2rem}
ul{list-style:none;margin:8px 0 0;padding:0;border-top:1px solid var(--line);max-width:30em}
li{padding:14px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
li span{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
a{color:var(--fg);text-underline-offset:3px}
a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
</style>
</head>
<body>
<main>
  <p class="label">Kryta Pływalnia Goczuś · Goczałkowice-Zdrój</p>
  <h1>Woda <i>&amp;</i> Fitness</h1>
  <p>Lekcje pływania z Jakubem Nachyłą. Pełna strona pojawi się tu wkrótce. Do tego czasu zapisy i pytania przyjmuję mailowo i na Instagramie.</p>
  <ul>
    <li><span>E-mail</span><a href="mailto:wodaifitness@gmail.com">wodaifitness@gmail.com</a></li>
    <li><span>Instagram</span><a href="https://www.instagram.com/jakubnachyla/" rel="noopener">@jakubnachyla</a></li>
  </ul>
</main>
</body>
